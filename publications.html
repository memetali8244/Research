    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary-blue: #1a2a44; --light-bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; line-height: 1.6; margin: 0; color: #333; background: #fff; }
        
        nav { background: var(--primary-blue); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { color: white; font-weight: bold; text-decoration: none; font-size: 1.2rem; }
        .nav-links { list-style: none; display: flex; margin: 0; }
        .nav-links li { margin-left: 20px; }
        .nav-links a { color: white; text-decoration: none; font-size: 0.9rem; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        h1 { color: var(--primary-blue); border-bottom: 4px solid var(--primary-blue); padding-bottom: 10px; margin-bottom: 30px; }

        .year-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 40px; position: sticky; top: 70px; background: white; padding: 15px 0; z-index: 99; border-bottom: 1px solid #eee; }
        .year-nav a { text-decoration: none; color: var(--primary-blue); border: 1px solid var(--primary-blue); padding: 5px 12px; border-radius: 4px; font-size: 0.85rem; font-weight: 600; transition: 0.3s; }
        .year-nav a:hover { background: var(--primary-blue); color: white; }

        .year-section { margin-bottom: 50px; scroll-margin-top: 140px; }
        .year-title { background: var(--light-bg); padding: 10px 20px; border-left: 6px solid var(--primary-blue); font-size: 1.6rem; color: var(--primary-blue); margin-bottom: 20px; }
        .pub-item { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #eee; text-align: justify; text-justify: inter-word; }
        .authors { font-weight: 500; color: #555; }
        .title { font-style: italic; color: #000; font-weight: 500; }
        .journal { color: var(--primary-blue); font-weight: 600; }
        sub { font-size: 0.75em; line-height: 0; position: relative; vertical-align: baseline; bottom: -0.25em; }

        footer { background: var(--primary-blue); color: white; text-align: center; padding: 25px; margin-top: 60px; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">AFM Group</a>

            // Buraya BibTeX dosyanızdaki diğer tüm girişler otomatik olarak eklenebilir.
        ];

        function renderPublications() {
            const container = document.getElementById('publications-container');
            const navContainer = document.getElementById('year-nav-container');
            
            // Yılları büyükten küçüğe sırala
            const years = [...new Set(publicationsData.map(p => p.year))].sort((a, b) => b - a);

            // Kimyasal formülleri (In2S3, GaSe vb.) otomatik alt indis yapar
            const formatTitle = (text) => {
                return text.replace(/([a-zA-Z])(\d+)/g, '$1<sub>$2</sub>')
                           .replace(/([a-zA-Z])(\_)/g, '$1'); // Alt çizgileri temizler
            };

            years.forEach(year => {
                navContainer.innerHTML += `<a href="#year-${year}">${year}</a>`;

                let sectionHTML = `<section id="year-${year}" class="year-section">
                    <div class="year-title">${year}</div>
                    <ul style="list-style:none; padding:0;">`;

                publicationsData.filter(p => p.year === year).forEach(pub => {
                    sectionHTML += `
                        <li class="pub-item">
                            <span class="authors">${pub.authors}</span>. 
                            <span class="title">"${formatTitle(pub.title)}"</span>. 
                            <span class="journal">${pub.journal} (${pub.year})</span>.
                        </li>`;
                });

                sectionHTML += `</ul></section>`;
                container.innerHTML += sectionHTML;
            });
        }

        window.onload = renderPublications;
    </script>
</body>
</html>
