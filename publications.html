<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications | AFM Research Group</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary-blue: #1a2a44; --light-bg: #f8f9fa; --accent: #3498db; }
        body { font-family: 'Segoe UI', sans-serif; line-height: 1.6; margin: 0; color: #333; }
        
        /* Navigation */
        nav { background: var(--primary-blue); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { color: white; font-weight: bold; text-decoration: none; font-size: 1.2rem; }
        .nav-links { list-style: none; display: flex; margin: 0; }
        .nav-links li { margin-left: 20px; }
        .nav-links a { color: white; text-decoration: none; font-size: 0.9rem; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        h1 { color: var(--primary-blue); border-bottom: 4px solid var(--primary-blue); padding-bottom: 10px; }

        /* Yıl Navigasyonu */
        .year-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 30px 0; position: sticky; top: 70px; background: white; padding: 10px 0; z-index: 99; border-bottom: 1px solid #eee; }
        .year-nav a { text-decoration: none; color: var(--primary-blue); border: 1px solid var(--primary-blue); padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; transition: 0.3s; }
        .year-nav a:hover { background: var(--primary-blue); color: white; }

        /* Yayın Listesi Tasarımı */
        .year-section { margin-bottom: 40px; scroll-margin-top: 130px; }
        .year-title { background: var(--light-bg); padding: 10px 20px; border-left: 5px solid var(--primary-blue); font-size: 1.4rem; color: var(--primary-blue); margin-bottom: 20px; }
        .pub-item { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #eee; text-align: justify; }
        .authors { font-weight: 500; }
        .title { font-style: italic; color: #000; }
        .journal { color: #666; font-weight: bold; }
        sub { font-size: 0.75em; }

        footer { background: var(--primary-blue); color: white; text-align: center; padding: 20px; margin-top: 50px; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">AFM Group</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="publications.html">Publications</a></li>
            <li><a href="#">Members</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Full List of Publications</h1>
        
        <div id="year-nav-container" class="year-nav"></div>

        <div id="publications-container"></div>
    </div>

    <footer><p>&copy; 2026 AFM Research Group</p></footer>

    <script>
        // Bibtex.txt dosyanızdan alınan verilerin bir kısmı (180 makaleyi buraya ekleyebilirsiniz)
        const publicationsData = [
            { year: 2026, authors: "O. Hilal, et al.", title: "Nonlinear optical and optical limiting properties of In2S3 chalcogenide thin films", journal: "Journal of Luminescence, 293, 121804" },
            { year: 2026, authors: "Isik, M, et al.", title: "As-rich GaAs Crystals: Temperature-Dependent Photoluminescence", journal: "Journal of Luminescence, 121783" },
            { year: 2025, authors: "Isik, M, et al.", title: "Nanoindentation study of PbMoO4 crystals", journal: "Materials Research" },
            { year: 2017, authors: "Isik, M, et al.", title: "Composition-tuned band gap energy and refractive index in GaSxSe1-x", journal: "Materials Chemistry and Physics, 190, 74" },
            { year: 2011, authors: "Isik, M, et al.", title: "Thermally stimulated current measurements in undoped Ga3InSe4", journal: "Journal of Physics and Chemistry of Solids, 72, 768" },
            { year: 2008, authors: "Isik, M, et al.", title: "Trap distribution in TlInS2 layered crystals", journal: "Journal of the Korean Physical Society, 367" }
            // Diğer 180 makaleyi de bu formatta eklemeye devam edebilirsiniz.
        ];

        function renderPublications() {
            const container = document.getElementById('publications-container');
            const navContainer = document.getElementById('year-nav-container');
            
            // Yılları büyükten küçüğe sırala ve benzersiz olanları al
            const years = [...new Set(publicationsData.map(p => p.year))].sort((a, b) => b - a);

            // Formül düzeltme: Sayıları otomatik alt indis yapar (örn: In2S3 -> In<sub>2</sub>S<sub>3</sub>)
            const formatTitle = (text) => text.replace(/([a-zA-Z])(\d+)/g, '$1<sub>$2</sub>');

            years.forEach(year => {
                // Navigasyon butonu ekle
                navContainer.innerHTML += `<a href="#year-${year}">${year}</a>`;

                // Yıl bölümü oluştur
                let sectionHTML = `<section id="year-${year}" class="year-section">
                    <div class="year-title">${year}</div>
                    <ul style="list-style:none; padding:0;">`;

                // O yıla ait makaleleri ekle
                publicationsData.filter(p => p.year === year).forEach(pub => {
                    sectionHTML += `
                        <li class="pub-item">
                            <span class="authors">${pub.authors}</span>. 
                            <span class="title">"${formatTitle(pub.title)}"</span>. 
                            <span class="journal">${pub.journal} (${pub.year})</span>.
                        </li>`;
                });

                sectionHTML += `</ul></section>`;
                container.innerHTML += sectionHTML;
            });
        }

        window.onload = renderPublications;
    </script>
</body>
</html>
